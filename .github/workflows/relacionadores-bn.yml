name: Actualizar relacionadores BN

on:
  schedule:
    - cron: "0 6 * * 1"      # lunes 06:00 UTC
  workflow_dispatch:         # permite ejecutarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml

      - run: python scripts/relacionadores_bn.py

      - name: Guardar en el repositorio
        run: |
          date -u +"%Y-%m-%d" > relacionadores_bn_verificado.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relacionadores_bn.json relacionadores_bn_verificado.txt
          git commit -m "Relacionadores BN: verificación semanal" || exit 0
          git push
